<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Overcore</title>
<style>
/* Janela do Overcore (22/10): separada do Actions. Mostra as execuções que o Overcore está rodando
   (agentes em worktrees), a pergunta de cada bloqueio e os botões de retomar e cancelar. Mesma família
   visual da ilha; azul no lugar do laranja do Actions. */
:root {
  --fundo: #11141a; --painel: #171a20; --vidro: rgba(255, 255, 255, .035); --vidro-luz: rgba(255, 255, 255, .08);
  --fio-luz: rgba(255, 255, 255, .12); --fio: rgba(255, 255, 255, .06);
  --tinta: #e8ebf2; --tinta-2: #9aa2b5; --tinta-3: #6b7283;
  --azul: #8fb8f6; --verde: #9fe045; --laranja: #f5a35f; --vermelho: #f07b7b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--tinta); background: var(--fundo); display: grid; grid-template-rows: 40px 1fr; overflow: hidden; }
button { font: inherit; color: inherit; }
.topo { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 0 150px 0 16px; border-bottom: 1px solid var(--fio); }
.topo h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--tinta-3); flex: none; }
.led.no-ar { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
.status { color: var(--tinta-2); font-size: 12px; white-space: nowrap; }
.filtros { -webkit-app-region: no-drag; display: flex; gap: 4px; margin-left: 14px; }
.chip { border: 0; background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); color: var(--tinta-2); font-size: 11.5px; padding: 3px 9px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--tinta); }
.chip.ativa { color: #10131a; background: var(--azul); box-shadow: none; font-weight: 600; }
.chip .n { margin-left: 4px; font-weight: 700; }
.topo input { -webkit-app-region: no-drag; margin-left: auto; width: 200px; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; color: var(--tinta); font: inherit; font-size: 12px; outline: none; background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); }
.lista { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.vazio { color: var(--tinta-3); padding: 8px 4px; }
.aviso { color: var(--tinta-2); padding: 0 4px; }
.exec { padding: 12px 14px; border-radius: 12px; background: linear-gradient(180deg, var(--vidro-luz), var(--vidro)); box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px var(--fio); }
.exec.pede { box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px rgba(245, 163, 95, .4); }
.exec header { display: flex; gap: 10px; align-items: baseline; }
.exec h3 { margin: 0; font-size: 13.5px; font-weight: 600; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.estado { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.e-running, .e-admitted, .e-planning, .e-cancelling { color: var(--azul); } .e-succeeded { color: var(--verde); }
.e-blocked { color: var(--laranja); } .e-failed { color: var(--vermelho); } .e-cancelled { color: var(--tinta-3); }
.onde { color: var(--tinta-3); font-size: 11px; margin-top: 2px; word-break: break-all; }
.resumo { font-size: 12px; margin: 6px 0; }
.pergunta { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--laranja); background: rgba(245, 163, 95, .07); border-radius: 0 8px 8px 0; font-size: 12.5px; }
.pergunta ul { margin: 6px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 12px; }
.acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.bt { -webkit-app-region: no-drag; border: 0; border-radius: 7px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; background: var(--vidro-luz); box-shadow: inset 0 0 0 1px var(--fio-luz); }
.bt:hover { background: rgba(255, 255, 255, .14); }
.bt.forte { background: rgba(159, 224, 69, .16); box-shadow: inset 0 0 0 1px rgba(159, 224, 69, .4); }
.bt.perigo { background: rgba(240, 123, 123, .12); box-shadow: inset 0 0 0 1px rgba(240, 123, 123, .35); }
.detalhe { margin-top: 8px; font-size: 11.5px; color: var(--tinta-2); }
.detalhe ol, .detalhe ul { margin: 4px 0; padding-left: 18px; }
.detalhe time { font: 10.5px Consolas, monospace; color: var(--tinta-3); margin-right: 6px; }
.erro { color: var(--vermelho); font-size: 11.5px; margin-top: 6px; }
</style>
</head>
<body>
<header class="topo">
  <i class="led" id="led"></i><h1>Overcore</h1><span class="status" id="status">lendo…</span>
  <nav class="filtros" id="filtros">
    <button class="chip ativa" data-filtro="todas">todas</button>
    <button class="chip" data-filtro="pede">pede você</button>
    <button class="chip" data-filtro="ativas">em andamento</button>
    <button class="chip" data-filtro="terminadas">terminadas</button>
  </nav>
  <input id="busca" type="search" placeholder="Filtrar" spellcheck="false">
</header>
<main class="lista" id="lista"></main>
<script src="overcore-janela.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Actions</title>
<style>
/* Janela Actions (21/10): mesa de decisão. Duas abas — Ideias (o que pede ele, potencial, andamento, o que
   não deu certo, última visita; à direita o ponto aberto com os botões de veredito) e Projetos (cards com
   checklist clicável, entregas datadas e as ideias ligadas). Mesma família visual da ilha (vidro escuro,
   fio de luz), numa janela normal: foco, Alt-Tab e barra de título. */
:root {
  --fundo: #121419;
  --painel: #171a20;
  --vidro: rgba(255, 255, 255, .035);
  --vidro-luz: rgba(255, 255, 255, .08);
  --fio-luz: rgba(255, 255, 255, .12);
  --fio: rgba(255, 255, 255, .06);
  --tinta: #e8ebf2;
  --tinta-2: #9aa2b5;
  --tinta-3: #6b7283;
  --azul: #8fb8f6;
  --verde: #9fe045;
  --laranja: #f5a35f;
  --vermelho: #f07b7b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 400 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color: var(--tinta); background: var(--fundo);
  display: grid; grid-template-rows: 40px 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
/* barra de título própria: arrastável; os botões do Windows ficam por cima, à direita (titleBarOverlay) */
.topo {
  -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 0 150px 0 16px;
  border-bottom: 1px solid var(--fio);
}
.topo h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
.topo .conta { color: var(--tinta-3); font-size: 12px; white-space: nowrap; }
.abas { -webkit-app-region: no-drag; display: flex; gap: 2px; margin-left: 14px; }
.aba { border: 0; background: none; padding: 5px 12px; border-radius: 7px; color: var(--tinta-2); font-size: 12px; cursor: pointer; }
.aba:hover { color: var(--tinta); background: var(--vidro); }
.aba.ativa { color: var(--tinta); background: var(--vidro-luz); box-shadow: inset 0 0 0 1px var(--fio-luz); }
.aba .n { margin-left: 6px; padding: 0 6px; border-radius: 9px; background: var(--laranja); color: #1b1206; font-weight: 700; font-size: 11px; }
.filtros { -webkit-app-region: no-drag; display: flex; gap: 4px; align-items: center; margin-left: 16px; }
.chip { border: 0; background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); color: var(--tinta-2); font-size: 11.5px; padding: 3px 9px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--tinta); }
.chip.ativa { color: #10131a; background: var(--azul); box-shadow: none; font-weight: 600; }
.filtros select { height: 24px; margin-left: 6px; border: 0; border-radius: 7px; padding: 0 6px; font: inherit; font-size: 11.5px; color: var(--tinta); background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); color-scheme: dark; }
.novo { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: #10131a; background: var(--verde); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.topo input {
  -webkit-app-region: no-drag; margin-left: auto; width: 180px; height: 26px; padding: 0 10px;
  border: 0; border-radius: 7px; color: var(--tinta); font: inherit; font-size: 12px; outline: none;
  background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio);
}
.topo input:focus { box-shadow: inset 0 0 0 1px var(--fio-luz); }
.corpo { display: grid; grid-template-columns: minmax(340px, 430px) 1fr; min-height: 0; }
.corpo[hidden], .projetos[hidden] { display: none; }

/* ── mesa (coluna esquerda) ─ */
.mesa { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--fio); }
.secao { margin: 10px 2px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .09em; color: var(--tinta-3); text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.secao:first-child { margin-top: 0; }
.secao .n { color: var(--tinta-2); }
.secao.quente { color: var(--laranja); }
.cartao {
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  background: linear-gradient(180deg, var(--vidro-luz), var(--vidro));
  box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px var(--fio);
}
.cartao:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .05)); }
.cartao.ativo { box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px rgba(143, 184, 246, .45); }
.cartao.pede { box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px rgba(245, 163, 95, .35); }
.cartao b { display: block; font-weight: 600; font-size: 12.5px; line-height: 1.35; }
.cartao p { margin: 3px 0 0; color: var(--tinta-2); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cartao .meta { color: var(--tinta-3); font-size: 11px; display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.tipo { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.t-veredito { color: var(--laranja); } .t-teste { color: var(--azul); } .t-entrega { color: var(--vermelho); }
.t-item-proposto { color: var(--verde); } .t-conserto { color: var(--vermelho); }
.pot { color: var(--verde); letter-spacing: -1px; margin-right: 6px; font-size: 11px; }
.colunas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.coluna { min-width: 0; }
.coluna h4 { margin: 2px 0 4px; font-size: 11px; color: var(--tinta-2); font-weight: 600; }
.mini { padding: 5px 8px; border-radius: 7px; background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); margin-bottom: 4px; cursor: pointer; font-size: 11.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
.mini:hover { background: var(--vidro-luz); }
.mini small { display: block; color: var(--tinta-3); font-size: 10.5px; }
.morto b { color: var(--tinta-2); text-decoration: line-through; text-decoration-color: rgba(240, 123, 123, .5); }
.vazio { color: var(--tinta-3); padding: 6px 4px; font-size: 12px; }

/* botões de decisão */
.acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.bt {
  border: 0; border-radius: 7px; padding: 4px 10px; font-size: 11.5px; cursor: pointer;
  background: var(--vidro-luz); box-shadow: inset 0 0 0 1px var(--fio-luz); color: var(--tinta);
}
.bt:hover { background: rgba(255, 255, 255, .14); }
.bt.forte { background: rgba(159, 224, 69, .16); box-shadow: inset 0 0 0 1px rgba(159, 224, 69, .4); }
.bt.perigo { background: rgba(240, 123, 123, .12); box-shadow: inset 0 0 0 1px rgba(240, 123, 123, .35); }
.form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; width: 100%; }
.form input, .form select {
  flex: 1; min-width: 120px; height: 26px; padding: 0 8px; border: 0; border-radius: 6px; font: inherit; font-size: 12px;
  color: var(--tinta); background: var(--painel); box-shadow: inset 0 0 0 1px var(--fio-luz); outline: none;
}
.form input[type="date"] { flex: 0 0 140px; color-scheme: dark; }
.erro { color: var(--vermelho); font-size: 11.5px; margin-top: 6px; }

/* ── ponto (coluna direita) ─ */
.ponto { overflow-y: auto; padding: 22px 32px 40px; }
.ponto .md { max-width: 820px; }
.decisao { max-width: 820px; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); }
.decisao .linha { display: flex; gap: 14px; flex-wrap: wrap; color: var(--tinta-2); font-size: 12px; }
.decisao .linha b { color: var(--tinta); font-weight: 600; }
.md h1 { font-size: 20px; margin: 0 0 14px; line-height: 1.3; }
.md h2 { font-size: 14px; margin: 26px 0 8px; color: var(--azul); }
.md h3 { font-size: 13px; margin: 18px 0 6px; }
.md p { margin: 8px 0; }
.md .cab { margin: 3px 0; }
.md blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--azul); color: var(--tinta-2); font-style: italic; }
.md ul { margin: 6px 0; padding-left: 20px; }
.md li { margin: 3px 0; }
.md code { font: 12px Consolas, monospace; background: var(--vidro-luz); padding: 1px 5px; border-radius: 4px; }
.md pre { font: 12px/1.45 Consolas, monospace; background: var(--painel); padding: 10px 12px; border-radius: 8px; overflow-x: auto; box-shadow: inset 0 0 0 1px var(--fio); }
.md strong { color: #fff; }
.md .link { color: var(--azul); }

/* ── projetos ─ */
.projetos { overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-content: start; }
.proj { padding: 12px 14px; border-radius: 12px; background: linear-gradient(180deg, var(--vidro-luz), var(--vidro)); box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px var(--fio); }
.proj header { display: flex; align-items: baseline; gap: 8px; }
.proj h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
.proj .marco { font-size: 11px; color: var(--tinta-2); white-space: nowrap; }
.proj .fase { color: var(--tinta-2); font-size: 12px; margin: 4px 0 2px; }
.proj .dor { color: var(--tinta-3); font-size: 11.5px; }
.proj .aviso { color: var(--laranja); font-size: 11.5px; margin-top: 6px; }
.proj .origem { color: var(--tinta-3); font-size: 10.5px; margin-top: 4px; word-break: break-all; }
.itens { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.item { display: flex; align-items: flex-start; gap: 8px; padding: 3px 4px; border-radius: 6px; font-size: 12px; }
.item:hover { background: var(--vidro); }
.item input { margin: 2px 0 0; accent-color: var(--verde); cursor: pointer; }
.item input:disabled { cursor: default; }
.item .tx { flex: 1; min-width: 0; }
.item.feito .tx { color: var(--tinta-3); text-decoration: line-through; }
.item .dt { font: 11px Consolas, monospace; color: var(--tinta-3); white-space: nowrap; }
.item .dt.perto { color: var(--laranja); }
.item .dt.venceu { color: var(--vermelho); }
.item.proposto .tx { color: var(--verde); font-style: italic; }
.item .mini-bt { border: 0; background: none; cursor: pointer; padding: 0 3px; font-size: 12px; color: var(--tinta-2); }
.item .mini-bt:hover { color: var(--tinta); }
.ligadas { margin-top: 10px; font-size: 11.5px; color: var(--tinta-2); display: flex; gap: 6px; flex-wrap: wrap; }
.ligadas span { padding: 1px 8px; border-radius: 9px; background: var(--vidro-luz); cursor: pointer; }

/* ── executar (caixa de texto: o que fazer e como conduzir) ─ */
.executar { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.executar textarea {
  width: 100%; min-height: 58px; resize: vertical; padding: 7px 9px; border: 0; border-radius: 8px;
  font: inherit; font-size: 12.5px; color: var(--tinta); background: var(--painel); box-shadow: inset 0 0 0 1px var(--fio-luz); outline: none;
}
.executar textarea:focus { box-shadow: inset 0 0 0 1px rgba(143, 184, 246, .5); }
.executar .linha-bt { display: flex; gap: 6px; align-items: center; }
.executar .dica { color: var(--tinta-3); font-size: 11px; margin-left: auto; }
.t-execucao { color: var(--vermelho); } .t-execucao-ok { color: var(--verde); }

/* ── execuções ─ */
.execs { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.execs[hidden] { display: none; }
.exec { padding: 12px 14px; border-radius: 12px; background: linear-gradient(180deg, var(--vidro-luz), var(--vidro)); box-shadow: inset 0 1px 0 var(--fio-luz), inset 0 0 0 1px var(--fio); }
.exec header { display: flex; gap: 10px; align-items: baseline; }
.exec h3 { margin: 0; font-size: 13.5px; font-weight: 600; flex: 1; }
.exec .estado { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.e-na-fila, .e-enviada { color: var(--azul); } .e-andando { color: var(--verde); } .e-concluida { color: var(--verde); }
.e-bloqueada, .e-falhou, .e-sem-sessao { color: var(--laranja); }
.exec .pedido { color: var(--tinta-2); font-size: 12px; margin: 6px 0; white-space: pre-wrap; }
.exec .onde { color: var(--tinta-3); font-size: 11px; }
.exec ol { margin: 8px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 11.5px; }
.exec ol li { margin: 2px 0; }
.exec ol time { font: 10.5px Consolas, monospace; color: var(--tinta-3); margin-right: 6px; }

</style>
</head>
<body>
<header class="topo">
  <h1>Actions</h1><span class="conta" id="conta"></span>
  <nav class="abas">
    <button class="aba ativa" data-aba="ideias" id="aba-ideias">Ideias</button>
    <button class="aba" data-aba="projetos" id="aba-projetos">Projetos</button>
    <button class="aba" data-aba="execucoes" id="aba-execucoes">Execuções</button>
  </nav>
  <div class="filtros" id="filtros">
    <button class="chip" data-periodo="hoje" title="Pontos que chegaram hoje">chegou hoje</button>
    <button class="chip" data-periodo="mexido" title="Pontos mexidos hoje (por você ou pela visita)">mexido hoje</button>
    <button class="chip" data-periodo="semana" title="Chegaram nos últimos 7 dias">7 dias</button>
    <button class="chip ativa" data-periodo="tudo">tudo</button>
    <select id="ordem" title="Ordem dos pontos">
      <option value="novos">mais novos</option>
      <option value="mexidos">último toque</option>
      <option value="prazo">prazo</option>
      <option value="potencial">potencial</option>
    </select>
  </div>
  <input id="busca" type="search" placeholder="Filtrar" spellcheck="false">
</header>
<main class="corpo" id="tela-ideias">
  <nav class="mesa" id="mesa"></nav>
  <article class="ponto" id="ponto"><div class="md vazio">Escolha um ponto.</div></article>
</main>
<section class="projetos" id="tela-projetos" hidden></section>
<section class="execs" id="tela-execucoes" hidden></section>
<script src="actions.js"></script>
</body>
</html>

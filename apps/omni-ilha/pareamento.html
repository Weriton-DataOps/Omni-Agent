<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Parear WhatsApp</title>
<style>
/* Janela "Parear WhatsApp" (F2, plano 4c). Dois números com papéis opostos: cada um é apresentado antes do
   QR dele, porque escanear com o celular errado é o erro provável. Mesma família visual do cofre e da ilha.
   O verde do WhatsApp aparece só no QR pronto para escanear; o botão cheio é neutro.
   Escalas: letra 11/13/16 (razão ~1,2 sobre 13), raio 4/8 e pílula, espaço em múltiplos de 4.
   Um só botão cheio por tela. */
:root {
  --fundo: #11141a; --vidro: rgba(255, 255, 255, .035); --vidro-luz: rgba(255, 255, 255, .08);
  --fio-luz: rgba(255, 255, 255, .12); --fio: rgba(255, 255, 255, .06);
  --tinta: #e8ebf2; --tinta-2: #9aa2b5; --tinta-3: #8a91a3;
  --whats: #22c55e; --ambar: #f5a524; --vermelho: #f07b7b;
  --l-meta: 11px; --l-corpo: 13px; --l-titulo: 16px;
  --r-marca: 4px; --r: 8px; --r-pilula: 999px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 var(--l-corpo)/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--tinta); background: var(--fundo); display: grid; grid-template-rows: 40px 1fr; overflow: hidden; }
button { font: inherit; color: inherit; }
.topo { -webkit-app-region: drag; display: flex; align-items: center; gap: 16px; padding: 0 152px 0 16px; border-bottom: 1px solid var(--fio); }
.topo h1 { font-size: var(--l-corpo); font-weight: 600; margin: 0; white-space: nowrap; }
.trilha { display: flex; gap: 12px; color: var(--tinta-3); font-size: var(--l-meta); white-space: nowrap; overflow: hidden; }
.trilha .atual { color: var(--tinta); font-weight: 600; }
.trilha .feito { color: var(--tinta-2); }
main { overflow-y: auto; padding: 24px 32px; }
.tela { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.passo { color: var(--tinta-2); font-size: var(--l-meta); }
h2 { margin: 0; font-size: var(--l-titulo); font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.forte-txt { font-weight: 600; }
.caminho { padding: 8px 12px; border-radius: var(--r); background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio); }
.feito-linha { color: var(--tinta-2); padding-bottom: 12px; border-bottom: 1px solid var(--fio); }
.qr { align-self: center; width: 312px; height: 312px; border-radius: var(--r); display: grid; place-items: center; text-align: center; padding: 16px; }
.qr.espera { background: var(--vidro); box-shadow: inset 0 0 0 1px var(--fio-luz); color: var(--tinta-2); }
.qr.pronto { background: #fff; box-shadow: 0 0 0 2px var(--whats); }
.qr img { width: 280px; height: 280px; image-rendering: pixelated; display: block; }
.nota { color: var(--tinta-3); font-size: var(--l-meta); }
.ficha { display: grid; grid-template-columns: 128px 1fr; gap: 4px 16px; margin: 0; }
.ficha dt { color: var(--tinta-3); font-size: var(--l-meta); line-height: 20px; }
.ficha dd { margin: 0; }
.erro-txt { color: var(--vermelho); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.bt { -webkit-app-region: no-drag; border: 0; border-radius: var(--r); padding: 4px 12px; cursor: pointer; background: var(--vidro-luz); box-shadow: inset 0 0 0 1px var(--fio-luz); white-space: nowrap; }
.bt:hover { background: rgba(255, 255, 255, .14); }
.bt.forte { color: var(--fundo); background: var(--tinta); box-shadow: none; font-weight: 600; }
.bt.forte:hover { background: #fff; }
.bt:focus-visible { outline: 2px solid var(--tinta-2); outline-offset: 2px; }
</style>
</head>
<body>
<header class="topo">
  <h1>Parear WhatsApp</h1>
  <nav class="trilha" id="trilha" aria-label="etapas"></nav>
</header>
<main id="tela"></main>
<script src="pareamento-telas.js"></script>
<script src="pareamento-janela.js"></script>
</body>
</html>

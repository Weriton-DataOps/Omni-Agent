<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Omni</title>
<style>
/* 27/10: a janela do chat com o Omni, aberta pelo balão do cabeçalho da ilha. Mesma gramática da ilha
   (preto, cards #141518, fio quase invisível, mono nos números); por enquanto só a forma: o que se
   escreve vira bolha aqui e não vai a lugar nenhum. */
:root {
  --ink: #f5f6f8; --dim: #9398a1; --dim-2: #8e939c; --dim-3: #6b7079;
  --fundo: #0e0f11; --card: #141518; --hairline: rgba(255, 255, 255, .06);
  --azul: #8fb8f6; --indigo: #6366f1; --verde: #22c55e;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fundo); overflow: hidden; }
body {
  font: 400 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink);
  display: grid; grid-template-rows: 40px 1fr auto; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* barra de título: arrastável; os botões do Windows ficam por cima à direita (titleBarOverlay) */
.barra { -webkit-app-region: drag; display: flex; align-items: center; gap: 9px; padding: 0 150px 0 14px; }
.barra img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(143, 184, 246, .35)); }
.barra b { font-weight: 600; font-size: 12.5px; }
.barra span { font-size: 11px; color: var(--dim-3); }
.barra .pt { width: 6px; height: 6px; border-radius: 50%; background: var(--dim-3); }

/* as mensagens: do Omni à esquerda com a face, as dele à direita em índigo */
.conversa {
  overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 10px;
  background: radial-gradient(420px 260px at 50% 110%, rgba(99, 102, 241, .12), transparent 70%);
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .14) transparent;
}
.dia { align-self: center; font: 500 10px/1 var(--mono); color: var(--dim-3); padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .04); }
.msg { display: flex; align-items: flex-end; gap: 8px; max-width: 86%; }
.msg .rosto { width: 26px; height: 26px; flex: none; object-fit: contain; }
.msg .bolha { padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; user-select: text; }
.msg .hora { font: 500 9.5px/1 var(--mono); color: var(--dim-3); flex: none; padding-bottom: 4px; }
.msg.omni .bolha { background: var(--card); box-shadow: inset 0 0 0 1px var(--hairline); border-bottom-left-radius: 5px; }
.msg.voce { align-self: flex-end; flex-direction: row-reverse; }
.msg.voce .bolha { background: rgba(99, 102, 241, .28); box-shadow: inset 0 0 0 1px rgba(129, 140, 248, .3); border-bottom-right-radius: 5px; }

/* a caixa de texto: cresce até 6 linhas; Enter envia, Shift+Enter quebra linha */
.compor { padding: 10px 14px 14px; }
.caixa {
  display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px;
  border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hairline);
  transition: box-shadow .15s;
}
.caixa:focus-within { box-shadow: inset 0 0 0 1px rgba(143, 184, 246, .35), 0 0 0 3px rgba(143, 184, 246, .08); }
textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--ink);
  font: inherit; line-height: 1.45; max-height: calc(1.45em * 6); padding: 5px 0; min-height: 0;
}
textarea::placeholder { color: var(--dim-3); }
.enviar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--ink); color: #0b0c0e; display: grid; place-items: center; transition: opacity .15s, transform .08s; }
.enviar:disabled { opacity: .25; cursor: default; }
.enviar:not(:disabled):active { transform: scale(.92); }
.enviar svg { width: 13px; height: 13px; }
.rodape { margin-top: 6px; padding: 0 6px; font-size: 10.5px; color: var(--dim-3); }
</style>
</head>
<body>
  <header class="barra">
    <img src="giro/g_8_4.png" alt="" draggable="false">
    <b>Omni</b><i class="pt" title="ainda não ligado"></i><span>chat</span>
  </header>

  <main class="conversa" id="conversa">
    <div class="dia" id="dia">hoje</div>
    <div class="msg omni">
      <img class="rosto" src="giro/g_8_4.png" alt="" draggable="false">
      <div class="bolha">Fala. Daqui eu ainda só escuto: o fio até mim chega depois. Mas pode testar a caixa.</div>
    </div>
  </main>

  <footer class="compor">
    <div class="caixa">
      <textarea id="entrada" rows="1" placeholder="Fala com o Omni…" autofocus></textarea>
      <button class="enviar" id="enviar" title="Enviar (Enter)" disabled>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>
      </button>
    </div>
    <div class="rodape">Enter envia · Shift+Enter quebra a linha</div>
  </footer>
<script src="chat.js"></script>
</body>
</html>
